# Gruppen der Statusseite "details" in Uptime Kuma.
# Die Uebersicht "default" steht in uptimekuma-statuspage-default.yaml.
# Ablauf und Aufruf: uptimekuma-statuspage.md
# Die Monitore muessen genau so heissen wie in Uptime Kuma. Bei gleichen Namen
# statt des Namens die Monitor-ID als Zahl eintragen.
#
# Reihenfolge der Gruppen: was andere brauchen, steht weiter oben.

url: http://debian-uptimekuma.lan:3001
slug: details          # der Teil nach /status/ in der URL

groups:
  Netzwerk:
    - Unifi Cloud Gateway Ultra
    - Unifi Switch (USW-Lite-16-PoE)
    - Unifi U6+ EG
    - Unifi U6+ OG
    - Unifi U6+ UG
    - Pihole DNS Primary
    - Pihole DNS Secondary
    - Lokale DNS-Namen

  Plattform:
    - Proxmox Node 01 HTTPS
    - Proxmox Node 02 HTTPS
    - Proxmox Node 03 HTTPS
    - TrueNas
    - Pihole Ping Primary
    - Pihole Ping Secondary
    - MBusMaster

  Dienste:
    - Glance
    - Change Detection
    - Nginx Proxy Manager HTTPS
    - Home Assistant
    - NextCloud
    - VaultWarden
    - gatogatogato.ch

  Geräte:
    - HomePod Bad OG
    - HomePod Büro
    - HomePod Küche
    - HomePod Schlafzimmer
    - HomePod Sportzimmer
    - HomePod Wohnzimmer
    - Velux Gateway
    - Zigbee stick SLZB-06M
    - eBUSd Controller
    - Huawei Emma

  Jobs:
    - Ansible Updates
    - Proxmox vzdump
    - Vaultwarden Backup
    - Vaultwarden-File
    - Snapshot 1
    - Snapshots 2
    - Snapshots 3
    - Snapshots 4
    - Snapshots 5
    - Cloud Sync
    - Github Mirror Push

  # alle Monitore mit dem Tag "inventar", angelegt von uptimekuma-sync.py
  Automatisch (Inventar):
    - tag: inventar
